name: Refresh prices
on:
  schedule:
    - cron: "37 22 * * 1-5"   # weekdays after the TSX close (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt yfinance
      - run: python scripts/fetch_prices.py
      - run: pip install pytest && pytest -q
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || git commit -m "Refresh prices $(date -u +%F)"
          git push
