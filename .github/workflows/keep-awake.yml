name: Keep app awake
on:
  schedule:
    - cron: "13 */6 * * *"    # every 6 hours; free apps sleep after ~12 hours without visitors
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/wake.py
        env:
          APP_URL: ${{ vars.APP_URL }}
